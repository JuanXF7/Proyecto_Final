<article class="product-card">
  <div class="product-image">
    <img [src]="imageUrl" [alt]="product.nombre" />
  </div>
  <div class="product-body">
    <div class="product-top">
      <span class="product-badge">{{ product.tipo || 'Celular' }}</span>
      <span class="product-stock">
        {{ product.stock > 0 ? 'En stock' : 'Agotado' }}
      </span>
    </div>
    <h3>{{ product.nombre }}</h3>
    <p>{{ product.marca }}</p>
    <div class="card-footer">
      <div class="price-block">
        <span *ngIf="product.promocion && (product.descuento ?? 0) > 0" class="price product-price-old">
          {{ product.precio | number:'1.0-0' }}
        </span>
        <span *ngIf="product.promocion && (product.descuento ?? 0) > 0" class="discounted-price">
          {{ getDiscountedPrice(product) | number:'1.0-0' }}
        </span>
        <span *ngIf="!product.promocion || (product.descuento ?? 0) === 0" class="price">
          {{ product.precio | number:'1.0-0' }}
        </span>
      </div>
      <button class="buy-btn" type="button" (click)="viewProduct.emit(product)">Ver producto</button>
    </div>
  </div>
</article>
